# Curated Gnosis Chain (chain_id 100) contracts and the view/pure calls we
# synthesize for them. Same schema as contracts.yaml — see that file's header
# for defaults and arg-typing rules.
#
# ABIs come from Gnosis Blockscout (keyless):
#   bash rpc-calls/scripts/generate-from-contracts/init.sh \
#     --config rpc-calls/scripts/generate-from-contracts/contracts-gnosis.yaml
#
# Every address, method and argument here was replayed against a Gnosis archive
# node and returns a non-error, non-empty result. Arguments that name an account
# (token holders, Aave suppliers, Safe owners, Circles avatars, Chainlink round
# ids, Balancer pool ids, HOPR channel ids) were taken from on-chain state so the
# calls touch real storage rather than empty slots.

arg_registry:
  addresses: []
  uints: []

contracts:
  # ─── ERC-20 ──────────────────────────────────────────────────────────────
  # Most Gnosis ERC-20s are Omnibridge-minted PermittableToken proxies; init.sh
  # resolves the implementation so the ABI matches the executable code.
