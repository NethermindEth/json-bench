name: Go

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Build, vet and test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bench
          POSTGRES_PASSWORD: bench
          POSTGRES_DB: bench
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bench"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt needed on:"
            echo "$unformatted"
            exit 1
          fi

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      # The debug-tagged helper binaries are excluded from every other target,
      # which is how four of them rotted into referencing deleted functions.
      - name: Vet debug helpers
        run: go vet -tags debug ./...

      # Without a database the storage and p99 suites skip rather than fail, so
      # the migrations and the comparability gate would go unexercised in CI.
      - name: Test
        run: go test -race ./...
        env:
          BENCH_TEST_POSTGRES_DSN: postgres://bench:bench@127.0.0.1:5432/bench?sslmode=disable
