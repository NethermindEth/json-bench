name: "Gnosis eth_getProof cross-node comparison"
description: >
  eth_getProof is excluded from `runner compare --from-jsonl` corpus mode (a node
  is not obliged to store proofs), so comparing it needs a curated call list.
  Generated from rpc-calls/proofs/eth_getProof-gnosis-latest.jsonl.

  Every call targets `latest` on purpose. A flat-state archive keeps the state
  trie only for the head, so the history-pinned companion set
  (rpc-calls/proofs/eth_getProof-gnosis.jsonl) is answerable by a trie archive
  alone and must not be run cross-node.

  Because these read head state, both endpoints must be at the same block for the
  run to mean anything — check the heads immediately before and after. Do NOT
  pass --block-override: rewriting `latest` to a pinned height turns every call
  into a historical proof the flat-state node cannot serve.

