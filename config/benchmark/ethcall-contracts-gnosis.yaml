test_name: "eth_call across curated Gnosis contracts"
description: "Exercises every Gnosis fixture under rpc-calls/contracts/ with equal weight. The clients listed here must point at Gnosis Chain (chain_id 100) endpoints — run against mainnet nodes every call returns empty or reverts. Companion to ethcall-contracts.yaml."
