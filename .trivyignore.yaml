# Findings in usr/bin/k6 — the load generator binary that grafana/k6 ships
# prebuilt. Nine are Go stdlib issues, one is golang.org/x/text, one is
# golang.org/x/crypto and two are google.golang.org/grpc, all vendored into that
# binary. The stdlib set needs Go 1.26.6; k6 2.1.0 is built with Go 1.26.4 and
# 2.2.0, the newest release, with 1.26.5, and 2.2.0 also still ships
# x/crypto 0.54.0 and grpc 1.83.0 against fixes in 0.55.0 and 1.83.1 — so no
# available tag clears the set and nothing in this repo rebuilds that binary.
# They stay suppressed until Grafana publishes a k6 built on patched
# dependencies.
#
# Scoped by purl, not by path: Trivy leaves PkgPath empty for Go-binary findings,
# so a path scope silently matches nothing. The purl pins each entry to the exact
# vulnerable artifact — k6's toolchain is pkg:golang/stdlib@v1.26.4 while our own
# binary is built with v1.25.14 — so the same CVE in our binary still fails the
# gate, and the suppression lapses on its own once k6 is rebuilt on a different
# Go, because the purl no longer matches. expired_at is the backstop: in December
# the scan goes red again and forces a re-check rather than hiding a stale
# exception forever.
#
# These two targets report zero findings, and that is what the narrow scope
# protects:
#   app/jsonrpc-bench-runner (gobinary)  0
#   local/runner (alpine 3.24.0)         0
vulnerabilities:
  - id: CVE-2026-33818
    purls: ["pkg:golang/stdlib@v1.26.4"]
    statement: "encoding/asn1 DoS in the Go stdlib of the prebuilt k6 binary; needs Go 1.26.6."
    expired_at: 2026-12-01
  - id: CVE-2026-39821
    purls: ["pkg:golang/stdlib@v1.26.4"]
    statement: "golang.org/x/net/idna issue in the Go stdlib of the prebuilt k6 binary; needs Go 1.26.6."
    expired_at: 2026-12-01
  - id: CVE-2026-46600
    purls: ["pkg:golang/stdlib@v1.26.4"]
    statement: "golang.org/x/net/dns/dnsmessage issue in the Go stdlib of the prebuilt k6 binary; needs Go 1.26.6."
    expired_at: 2026-12-01
  - id: CVE-2026-56853
    purls: ["pkg:golang/stdlib@v1.26.4"]
    statement: "net/http unencrypted HTTP/2 issue in the Go stdlib of the prebuilt k6 binary; needs Go 1.26.6."
    expired_at: 2026-12-01
  - id: CVE-2026-56858
    purls: ["pkg:golang/stdlib@v1.26.4"]
    statement: "html/template XSS in the Go stdlib of the prebuilt k6 binary; needs Go 1.26.6."
    expired_at: 2026-12-01
  - id: CVE-2026-56859
    purls: ["pkg:golang/stdlib@v1.26.4"]
    statement: "encoding/xml DoS in the Go stdlib of the prebuilt k6 binary; needs Go 1.26.6."
    expired_at: 2026-12-01
  - id: CVE-2026-56860
    purls: ["pkg:golang/stdlib@v1.26.4"]
    statement: "net/url DoS in the Go stdlib of the prebuilt k6 binary; needs Go 1.26.6."
    expired_at: 2026-12-01
  - id: CVE-2026-56862
    purls: ["pkg:golang/stdlib@v1.26.4"]
    statement: "crypto/tls DoS in the Go stdlib of the prebuilt k6 binary; needs Go 1.26.6."
    expired_at: 2026-12-01
  - id: CVE-2026-56852
    purls: ["pkg:golang/golang.org/x/text@v0.38.0"]
    statement: "golang.org/x/text DoS vendored into the prebuilt k6 binary; needs x/text 0.39.0."
    expired_at: 2026-12-01
  - id: CVE-2026-39822
    purls: ["pkg:golang/stdlib@v1.26.4"]
    statement: "os.Root symlink traversal in the Go stdlib of the prebuilt k6 binary; needs Go 1.26.5."
    expired_at: 2026-12-01
  - id: CVE-2026-56854
    purls: ["pkg:golang/golang.org/x/crypto@v0.53.0"]
    statement: >-
      golang.org/x/crypto/ssh source-address restrictions unenforced for the
      password, keyboard-interactive, no-client-auth and GSSAPI callbacks,
      vendored into the prebuilt k6 binary; needs x/crypto 0.55.0. Only reachable
      in an SSH server built on that package — the image runs no SSH server and
      neither k6 nor our runner serves SSH.
    expired_at: 2026-12-01
  - id: CVE-2026-84304
    purls: ["pkg:golang/google.golang.org/grpc@v1.81.1"]
    statement: >-
      gRPC-Go heap exhaustion from fragmented HTTP/2 DATA frames vendored into
      the prebuilt k6 binary; needs grpc 1.83.1. Server-side only, driven by an
      attacker's inbound streams — k6's gRPC module is a client and this suite
      benchmarks JSON-RPC over HTTP, so no gRPC server is ever listening.
    expired_at: 2026-12-01
  - id: GHSA-hrxh-6v49-42gf
    purls: ["pkg:golang/google.golang.org/grpc@v1.81.1"]
    statement: "gRPC-Go xDS RBAC and HTTP/2 issues vendored into the prebuilt k6 binary; needs grpc 1.82.1."
    expired_at: 2026-12-01
