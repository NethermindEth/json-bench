# Findings in usr/bin/k6 — the load generator binary that grafana/k6 ships
# prebuilt. Nine are Go stdlib issues, one is golang.org/x/text and one is
# google.golang.org/grpc, all vendored into that binary. Most need Go 1.26.6;
# k6 2.1.0 is built with Go 1.26.4 and 2.2.0, the newest release, with 1.26.5,
# so no available tag clears the set and nothing in this repo rebuilds that
# binary. They stay suppressed until Grafana publishes a k6 built on a patched
# toolchain.
#
# Scoped by purl, not by path: Trivy leaves PkgPath empty for Go-binary findings,
# so a path scope silently matches nothing. The purl pins each entry to the exact
# vulnerable artifact — k6's toolchain is pkg:golang/stdlib@v1.26.4 while our own
# binary is built with v1.25.14 — so the same CVE in our binary still fails the
# gate, and the suppression lapses on its own once k6 is rebuilt on a different
# Go, because the purl no longer matches. expired_at is the backstop: in December
# the scan goes red again and forces a re-check rather than hiding a stale
# exception forever.
#
# These two targets report zero findings, and that is what the narrow scope
# protects:
#   app/jsonrpc-bench-runner (gobinary)  0
#   local/runner (alpine 3.24.0)         0
vulnerabilities:
  - id: CVE-2026-33818
    purls: ["pkg:golang/stdlib@v1.26.4"]
    statement: "encoding/asn1 DoS in the Go stdlib of the prebuilt k6 binary; needs Go 1.26.6."
    expired_at: 2026-12-01
  - id: CVE-2026-39821
    purls: ["pkg:golang/stdlib@v1.26.4"]
    statement: "golang.org/x/net/idna issue in the Go stdlib of the prebuilt k6 binary; needs Go 1.26.6."
    expired_at: 2026-12-01
